# Mistral OCR - Classify Document connector i18n properties

connectorDefinitionLabel=Mistral OCR - Classify Document [BETA]
Mistral OCR.category=Mistral OCR
connectorDefinitionDescription=Classify a document into one of the provided types using Mistral Vision

# Page labels
connectionPage.pageTitle=Connection
connectionPage.pageDescription=Configure authentication and connection settings
operationPage.pageTitle=Classification
operationPage.pageDescription=Configure the document and classification parameters

# Connection widgets
apiKeyWidget.label=API Key
apiKeyWidget.description=Mistral API key for authentication
baseUrlWidget.label=Base URL
baseUrlWidget.description=Mistral API base URL (default: https://api.mistral.ai/v1)
modelWidget.label=Model
modelWidget.description=Vision model to use (default: pixtral-large-latest)
connectTimeoutWidget.label=Connect Timeout (ms)
connectTimeoutWidget.description=Connection timeout in milliseconds
readTimeoutWidget.label=Read Timeout (ms)
readTimeoutWidget.description=Read timeout in milliseconds

# Operation widgets
documentBase64Widget.label=Document (Base64)
documentBase64Widget.description=Base64-encoded document content (PDF or image)
imageUrlWidget.label=Image URL
imageUrlWidget.description=URL of the document to process (alternative to Base64)
mimeTypeWidget.label=MIME Type
mimeTypeWidget.description=MIME type of the document (default: application/pdf)
documentTypesWidget.label=Document Types
documentTypesWidget.description=Comma-separated list of document types for classification (e.g., invoice, receipt, contract)
includeReasoningWidget.label=Include Reasoning
includeReasoningWidget.description=Whether to include reasoning for the classification decision
startPageWidget.label=Start Page
startPageWidget.description=First page to process, 1-indexed (optional; leave blank to classify the whole document)
endPageWidget.label=End Page
endPageWidget.description=Last page to process, 1-indexed inclusive (optional; leave blank to classify the whole document)
